services:
  octopus-wheel-spinner:
    container_name: octopus-wheel-spinner
    image: octopus-wheel-spinner
    build:
      context: .
      dockerfile: OctopusWheelSpinner/Dockerfile
    env_file:
      - OctopusWheelSpinner/.env
    environment:
      DB_PATH: /data/spins.db
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
